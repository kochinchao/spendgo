<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelTracker - 個人旅行記帳</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Hide scrollbar for cleaner mobile look but allow scrolling */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
        }
        .progress-transition {
            transition: width 0.5s ease-in-out, background-color 0.5s ease;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-blue-200">

    <!-- Main Container (Responsive) -->
    <div class="max-w-6xl mx-auto min-h-screen md:min-h-[95vh] md:my-4 pb-24 relative shadow-2xl bg-slate-50 overflow-hidden md:rounded-3xl">
        
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white p-6 md:px-10 rounded-b-3xl shadow-md">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-xl font-bold tracking-wider"><i class="fa-solid fa-plane-departure mr-2"></i>旅費追蹤</h1>
                <button onclick="exportToExcel()" class="bg-white/20 hover:bg-white/30 p-2 rounded-full transition" title="匯出Excel">
                    <i class="fa-solid fa-file-excel text-lg"></i>
                </button>
            </div>

            <!-- Budget Visualizer -->
            <div class="mt-2">
                <div class="flex justify-between items-end mb-2 text-sm font-medium">
                    <div class="opacity-90">目前花費 (TWD)</div>
                    <div class="text-right">
                        <span id="display-spent" class="text-2xl font-bold text-white">0</span> 
                        <span class="opacity-75">/ <span id="display-budget">0</span></span>
                    </div>
                </div>
                <!-- Progress Bar -->
                <div class="w-full bg-black/20 rounded-full h-3 mb-2 overflow-hidden">
                    <div id="budget-progress" class="bg-green-400 h-3 rounded-full progress-transition" style="width: 0%"></div>
                </div>
                <div class="flex justify-between items-center text-xs opacity-80">
                    <span id="budget-status-text">剩餘: 0 TWD</span>
                    <button onclick="toggleBudgetSetting()" class="underline underline-offset-2"><i class="fa-solid fa-pen mr-1"></i>設定預算</button>
                </div>
            </div>
        </header>

        <!-- Budget Setting Modal (Hidden by default) -->
        <div id="budget-modal" class="hidden fixed inset-0 z-50 bg-black/50 flex items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-xl animate-fade-in-up">
                <h3 class="text-lg font-bold mb-4 text-slate-800">設定總預算 (TWD)</h3>
                <input type="number" id="budget-input" class="w-full p-3 border border-slate-300 rounded-xl mb-4 focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="輸入台幣預算">
                <div class="flex justify-end space-x-3">
                    <button onclick="toggleBudgetSetting()" class="px-4 py-2 text-slate-500 hover:bg-slate-100 rounded-lg transition">取消</button>
                    <button onclick="saveBudget()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">儲存</button>
                </div>
            </div>
        </div>

        <!-- Main Layout (Grid on Tablet/Desktop) -->
        <main class="p-4 md:p-8 lg:p-10 grid grid-cols-1 md:grid-cols-12 gap-8 items-start">
            
            <!-- Add Expense Form -->
            <section class="glass-card rounded-2xl p-5 md:col-span-5 lg:col-span-4 md:sticky md:top-8 shadow-sm">
                <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-4"><i class="fa-solid fa-pen-to-square mr-2"></i>快速記帳</h2>
                <form id="expense-form" class="space-y-4">
                    
                    <!-- Date & Category Row (3:2) -->
                    <div class="grid grid-cols-5 gap-3">
                        <div class="col-span-3">
                            <label class="block text-xs font-medium text-slate-500 mb-1">消費時間</label>
                            <input type="datetime-local" id="expense-date" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                        </div>
                        <div class="col-span-2">
                            <label class="block text-xs font-medium text-slate-500 mb-1">消費項目</label>
                            <select id="expense-category" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none">
                                <option value="餐廳">🍽️ 餐廳</option>
                                <option value="小吃">🌭 小吃</option>
                                <option value="咖啡">☕ 咖啡</option>
                                <option value="交通">🚆 交通</option>
                                <option value="住宿">🏨 住宿</option>
                                <option value="景點門票">🎫 門票</option>
                                <option value="伴手禮">🎁 伴手禮</option>
                                <option value="購物">🛍️ 購物</option>
                                <option value="其他">📌 其他</option>
                            </select>
                        </div>
                    </div>

                    <!-- Currency & Amount Row (1:1) -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">幣別</label>
                            <select id="expense-currency" onchange="calculateTwd()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none font-semibold text-blue-600">
                                <!-- JS Populate -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-slate-500 mb-1">金額 (外幣)</label>
                            <input type="number" id="expense-amount" oninput="calculateTwd()" step="any" min="0" required class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="0">
                        </div>
                    </div>

                    <!-- Auto Exchange Rate Display -->
                    <div class="bg-blue-50 text-blue-800 text-xs p-3 rounded-xl flex justify-between items-center border border-blue-100">
                        <div>
                            <i class="fa-solid fa-bolt text-yellow-500 mr-1"></i> 換算台幣 (匯率: <span id="current-rate">載入中...</span>)
                        </div>
                        <div class="font-bold text-sm">
                            NT$ <span id="converted-twd">0</span>
                        </div>
                    </div>

                    <!-- Note (Auto-expanding Textarea) -->
                    <div>
                        <textarea id="expense-note" rows="1" placeholder="備註說明 (選填，例如：一蘭拉麵)" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none overflow-hidden min-h-[44px]" oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"></textarea>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition active:scale-95 shadow-md">
                        <i class="fa-solid fa-plus mr-1"></i> 新增紀錄
                    </button>
                </form>
            </section>

            <!-- Expense List -->
            <section class="md:col-span-7 lg:col-span-8">
                <div class="flex justify-between items-center mb-3 pl-1">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider"><i class="fa-solid fa-list-ul mr-2"></i>歷史紀錄</h2>
                    <button onclick="clearAllExpenses()" class="text-xs text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-full transition shadow-sm border border-red-100">
                        <i class="fa-solid fa-trash-can mr-1"></i>一鍵清空
                    </button>
                </div>
                <div id="expense-list" class="space-y-3 overflow-hidden">
                    <!-- Expenses will be injected here -->
                </div>
            </section>
        </main>

        <!-- Floating Notification -->
        <div id="toast" class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-sm font-medium opacity-0 transition-opacity duration-300 pointer-events-none z-50 shadow-lg flex items-center">
            <i class="fa-solid fa-check-circle text-green-400 mr-2"></i> <span id="toast-msg">新增成功</span>
        </div>
    </div>

    <script>
        // --- State Management ---
        let expenses = JSON.parse(localStorage.getItem('travel_expenses')) || [];
        let budgetTwd = parseFloat(localStorage.getItem('travel_budget')) || 0;
        let ratesCache = JSON.parse(localStorage.getItem('travel_rates_cache')) || {};
        let currentRate = 1; // Multiplier to get TWD

        // --- Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            // Populate Currencies
            populateCurrencies();

            // Set default date to now
            setDefaultDate();
            
            // Render UI
            updateDashboard();
            renderExpenses();
            
            // Fetch real-time exchange rates
            fetchExchangeRates();

            // Form Submit Event
            document.getElementById('expense-form').addEventListener('submit', addExpense);
        });

        function setDefaultDate() {
            const now = new Date();
            // Format for datetime-local: YYYY-MM-DDThh:mm
            const tzOffset = now.getTimezoneOffset() * 60000;
            const localISOTime = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 16);
            document.getElementById('expense-date').value = localISOTime;
        }

        function populateCurrencies() {
            const CURRENCIES = {
                common: [
                    {code: 'TWD', name: '台幣'}, {code: 'JPY', name: '日圓'}, {code: 'USD', name: '美金'},
                    {code: 'KRW', name: '韓元'}, {code: 'EUR', name: '歐元'}, {code: 'THB', name: '泰銖'}
                ],
                others: [
                    {code: 'AED', name: '阿聯酋迪拉姆'}, {code: 'ARS', name: '阿根廷披索'}, {code: 'AUD', name: '澳幣'}, 
                    {code: 'BRL', name: '巴西雷亞爾'}, {code: 'CAD', name: '加幣'}, {code: 'CHF', name: '瑞士法郎'}, 
                    {code: 'CLP', name: '智利披索'}, {code: 'CNY', name: '人民幣'}, {code: 'COP', name: '哥倫比亞披索'},
                    {code: 'CZK', name: '捷克克朗'}, {code: 'DKK', name: '丹麥克朗'}, {code: 'EGP', name: '埃及鎊'}, 
                    {code: 'GBP', name: '英鎊'}, {code: 'HKD', name: '港幣'}, {code: 'HUF', name: '匈牙利福林'}, 
                    {code: 'IDR', name: '印尼盾'}, {code: 'ILS', name: '以色列新謝克爾'}, {code: 'INR', name: '印度盧比'}, 
                    {code: 'MXN', name: '墨西哥披索'}, {code: 'MYR', name: '馬來西亞令吉'}, {code: 'NOK', name: '挪威克朗'},
                    {code: 'NZD', name: '紐西蘭幣'}, {code: 'PEN', name: '秘魯索爾'}, {code: 'PHP', name: '菲律賓披索'}, 
                    {code: 'PLN', name: '波蘭茲羅提'}, {code: 'SEK', name: '瑞典克朗'}, {code: 'SGD', name: '新加坡幣'}, 
                    {code: 'TRY', name: '土耳其里拉'}, {code: 'VND', name: '越南盾'}, {code: 'ZAR', name: '南非蘭特'}
                ]
            };

            const select = document.getElementById('expense-currency');
            select.innerHTML = '';
            
            const commonGroup = document.createElement('optgroup');
            commonGroup.label = '常用幣別';
            CURRENCIES.common.forEach(c => {
                commonGroup.innerHTML += `<option value="${c.code}">${c.code} ${c.name}</option>`;
            });
            
            const othersGroup = document.createElement('optgroup');
            othersGroup.label = '其他幣別';
            CURRENCIES.others.forEach(c => {
                othersGroup.innerHTML += `<option value="${c.code}">${c.code} ${c.name}</option>`;
            });

            select.appendChild(commonGroup);
            select.appendChild(othersGroup);
            
            select.value = 'JPY'; // 預設幣別
        }

        // --- Currency Exchange API ---
        async function fetchExchangeRates() {
            try {
                // Using a free, no-key required API. Base is TWD.
                const response = await fetch('https://open.er-api.com/v6/latest/TWD');
                const data = await response.json();
                
                if (data.result === 'success') {
                    ratesCache = data.rates;
                    localStorage.setItem('travel_rates_cache', JSON.stringify(ratesCache));
                    calculateTwd(); // Update current form based on fetched rate
                }
            } catch (error) {
                console.error("無法取得即時匯率，將使用上次快取:", error);
                if (Object.keys(ratesCache).length > 0) {
                    calculateTwd(); // Fallback to cache
                } else {
                    document.getElementById('current-rate').innerText = "無法取得匯率";
                }
            }
        }

        function calculateTwd() {
            const currency = document.getElementById('expense-currency').value;
            const amountInput = document.getElementById('expense-amount').value;
            const amount = parseFloat(amountInput) || 0;

            if (currency === 'TWD') {
                currentRate = 1;
                document.getElementById('current-rate').innerText = "1.000";
                document.getElementById('converted-twd').innerText = amount.toLocaleString('en-US');
                return;
            }

            if (ratesCache && ratesCache[currency]) {
                // API gives rate like 1 TWD = 4.6 JPY
                // So to get TWD from JPY: JPY / 4.6 = TWD
                const rateToTwd = 1 / ratesCache[currency];
                currentRate = rateToTwd;
                document.getElementById('current-rate').innerText = rateToTwd.toFixed(4);
                
                const twdValue = Math.round(amount * rateToTwd);
                document.getElementById('converted-twd').innerText = twdValue.toLocaleString('en-US');
            } else {
                document.getElementById('current-rate').innerText = "載入中...";
                document.getElementById('converted-twd').innerText = "0";
            }
        }

        // --- Business Logic ---
        function addExpense(e) {
            e.preventDefault();
            
            const date = document.getElementById('expense-date').value;
            const category = document.getElementById('expense-category').value;
            const currency = document.getElementById('expense-currency').value;
            const amount = parseFloat(document.getElementById('expense-amount').value);
            const note = document.getElementById('expense-note').value;
            
            let twdAmount = amount;
            if (currency !== 'TWD' && ratesCache[currency]) {
                twdAmount = Math.round(amount * (1 / ratesCache[currency]));
            }

            const newExpense = {
                id: Date.now().toString(),
                date: date,
                category: category,
                currency: currency,
                amount: amount,
                twdAmount: twdAmount,
                rate: currentRate,
                note: note
            };

            expenses.unshift(newExpense); // Add to beginning of array
            saveData();
            
            // Reset form partly
            document.getElementById('expense-amount').value = '';
            document.getElementById('expense-note').value = '';
            document.getElementById('expense-note').style.height = ''; // 恢復備註框的預設高度
            setDefaultDate();
            calculateTwd();
            
            // Update UI
            updateDashboard();
            renderExpenses();
            showToast("紀錄已新增！");
        }

        function deleteExpense(id) {
            // 直接刪除，不跳出確認對話框
            expenses = expenses.filter(exp => exp.id !== id);
            saveData();
            updateDashboard();
            renderExpenses();
            showToast("紀錄已刪除");
        }

        function clearAllExpenses() {
            if (expenses.length === 0) {
                alert("目前沒有任何紀錄喔！");
                return;
            }
            if (confirm("確定要清空所有紀錄嗎？\n清空前建議先匯出 Excel 備份！\n\n(此動作無法復原)")) {
                expenses = [];
                saveData();
                updateDashboard();
                renderExpenses();
                showToast("紀錄已全部清空！");
            }
        }

        function saveData() {
            localStorage.setItem('travel_expenses', JSON.stringify(expenses));
        }

        // --- Budget Logic ---
        function toggleBudgetSetting() {
            const modal = document.getElementById('budget-modal');
            const input = document.getElementById('budget-input');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                input.value = budgetTwd || '';
                input.focus();
            } else {
                modal.classList.add('hidden');
            }
        }

        function saveBudget() {
            const input = document.getElementById('budget-input').value;
            budgetTwd = parseFloat(input) || 0;
            localStorage.setItem('travel_budget', budgetTwd);
            toggleBudgetSetting();
            updateDashboard();
            showToast("預算已更新！");
        }

        // --- UI Rendering ---
        function updateDashboard() {
            const totalSpent = expenses.reduce((sum, exp) => sum + exp.twdAmount, 0);
            
            document.getElementById('display-spent').innerText = totalSpent.toLocaleString('en-US');
            document.getElementById('display-budget').innerText = budgetTwd.toLocaleString('en-US');

            const progressBar = document.getElementById('budget-progress');
            const statusText = document.getElementById('budget-status-text');
            
            if (budgetTwd > 0) {
                let percentage = (totalSpent / budgetTwd) * 100;
                let displayPercent = Math.min(percentage, 100);
                progressBar.style.width = displayPercent + '%';

                // Color coding based on health
                if (percentage < 60) {
                    progressBar.className = "h-3 rounded-full progress-transition bg-green-400";
                } else if (percentage < 90) {
                    progressBar.className = "h-3 rounded-full progress-transition bg-yellow-400";
                } else {
                    progressBar.className = "h-3 rounded-full progress-transition bg-red-500";
                }

                const remaining = budgetTwd - totalSpent;
                if (remaining >= 0) {
                    statusText.innerText = `剩餘: ${remaining.toLocaleString('en-US')} TWD`;
                    statusText.className = "text-xs opacity-80 text-white";
                } else {
                    statusText.innerText = `超支: ${Math.abs(remaining).toLocaleString('en-US')} TWD`;
                    statusText.className = "text-xs font-bold text-red-300";
                }
            } else {
                progressBar.style.width = '0%';
                statusText.innerText = "尚未設定預算";
                progressBar.className = "h-3 rounded-full progress-transition bg-slate-300";
            }
        }

        function getCategoryIcon(cat) {
            const icons = {
                "餐廳": "fa-utensils text-orange-500 bg-orange-100",
                "小吃": "fa-burger text-yellow-600 bg-yellow-100",
                "交通": "fa-train-subway text-blue-500 bg-blue-100",
                "住宿": "fa-bed text-indigo-500 bg-indigo-100",
                "景點門票": "fa-ticket text-pink-500 bg-pink-100",
                "伴手禮": "fa-gift text-red-500 bg-red-100",
                "購物": "fa-bag-shopping text-purple-500 bg-purple-100",
                "其他": "fa-receipt text-slate-500 bg-slate-200"
            };
            return icons[cat] || "fa-circle-dollar-to-slot text-green-500 bg-green-100";
        }

        function renderExpenses() {
            const list = document.getElementById('expense-list');
            list.innerHTML = '';

            if (expenses.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-8 text-slate-400">
                        <i class="fa-solid fa-box-open text-4xl mb-3 opacity-50"></i>
                        <p class="text-sm">尚未有任何花費紀錄</p>
                    </div>
                `;
                return;
            }

            expenses.forEach(exp => {
                // Format Date: YYYY-MM-DD HH:mm -> MM/DD HH:mm
                const d = new Date(exp.date);
                const dateStr = `${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
                
                const iconClasses = getCategoryIcon(exp.category);

                const item = document.createElement('div');
                item.className = "glass-card p-4 rounded-xl flex items-center justify-between";
                
                // 綁定滑動刪除事件 (Touch events)
                item.setAttribute("ontouchstart", `touchStart(event, '${exp.id}')`);
                item.setAttribute("ontouchmove", `touchMove(event)`);
                item.setAttribute("ontouchend", `touchEnd(event)`);

                item.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <div class="w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 ${iconClasses.split(' ').slice(1).join(' ')}">
                            <i class="fa-solid ${iconClasses.split(' ')[0]} text-lg"></i>
                        </div>
                        <div>
                            <h3 class="font-bold text-slate-800 text-sm">${exp.category} <span class="font-normal text-xs text-slate-500 ml-1">${exp.note ? '- ' + exp.note : ''}</span></h3>
                            <p class="text-xs text-slate-400 mt-0.5">${dateStr}</p>
                        </div>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <div class="font-bold text-slate-800 text-sm">NT$ ${exp.twdAmount.toLocaleString('en-US')}</div>
                        <div class="text-xs text-slate-400">${exp.currency} ${exp.amount.toLocaleString('en-US', {minimumFractionDigits: 0, maximumFractionDigits: 2})}</div>
                        <button onclick="deleteExpense('${exp.id}')" class="text-red-400 hover:text-red-600 text-xs mt-1 transition p-1" title="直接刪除">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // --- Swipe to Delete Logic (滑動刪除邏輯) ---
        let swipeState = { startX: 0, startY: 0, currentX: 0, element: null, id: null, isSwiping: false, isScrolling: false };

        function touchStart(e, id) {
            swipeState.startX = e.touches[0].clientX;
            swipeState.startY = e.touches[0].clientY;
            swipeState.element = e.currentTarget;
            swipeState.id = id;
            swipeState.isSwiping = false;
            swipeState.isScrolling = false;
            swipeState.element.style.transition = 'none'; // 取消動畫以平滑拖移
        }

        function touchMove(e) {
            if (!swipeState.element) return;
            
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let deltaX = currentX - swipeState.startX;
            let deltaY = currentY - swipeState.startY;

            // 判斷是上下滑動(滾動)還是左右滑動(準備刪除)
            if (!swipeState.isSwiping && !swipeState.isScrolling) {
                if (Math.abs(deltaX) > Math.abs(deltaY)) {
                    swipeState.isSwiping = true;
                } else {
                    swipeState.isScrolling = true;
                }
            }

            if (swipeState.isSwiping) {
                // 如果是水平滑動，嘗試阻止預設的滾動事件
                if (e.cancelable) e.preventDefault(); 
                
                swipeState.currentX = currentX;
                swipeState.element.style.transform = `translateX(${deltaX}px)`;
                swipeState.element.style.opacity = 1 - (Math.abs(deltaX) / window.innerWidth);
            }
        }

        function touchEnd(e) {
            if (!swipeState.element || !swipeState.isSwiping) {
                // 如果只是滾動或沒有滑動，重置狀態
                swipeState = { startX: 0, startY: 0, currentX: 0, element: null, id: null, isSwiping: false, isScrolling: false };
                return;
            }
            
            let deltaX = swipeState.currentX - swipeState.startX;
            if (Math.abs(deltaX) > 100) { 
                // 滑動距離超過 100px，飛出並執行刪除
                swipeState.element.style.transition = 'transform 0.3s ease-out, opacity 0.3s ease-out';
                swipeState.element.style.transform = `translateX(${deltaX > 0 ? window.innerWidth : -window.innerWidth}px)`;
                swipeState.element.style.opacity = '0';
                
                let deleteId = swipeState.id;
                setTimeout(() => {
                    deleteExpense(deleteId);
                }, 300); // 等待動畫播完再刪資料
            } else {
                // 距離不夠，回彈原位
                swipeState.element.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                swipeState.element.style.transform = 'translateX(0px)';
                swipeState.element.style.opacity = '1';
            }
            swipeState = { startX: 0, startY: 0, currentX: 0, element: null, id: null, isSwiping: false, isScrolling: false };
        }

        // --- Export & UI Utils ---
        function exportToExcel() {
            if (expenses.length === 0) {
                alert("目前沒有資料可以匯出喔！");
                return;
            }

            // Prepare data for Excel
            const exportData = expenses.map(e => {
                return {
                    "消費時間": e.date.replace('T', ' '),
                    "分類": e.category,
                    "說明": e.note,
                    "幣別": e.currency,
                    "外幣金額": e.amount,
                    "匯率 (相對於TWD)": e.rate.toFixed(4),
                    "台幣金額 (TWD)": e.twdAmount
                }
            });

            // Create Worksheet
            const worksheet = XLSX.utils.json_to_sheet(exportData);
            
            // Create Workbook
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "旅行記帳紀錄");

            // Generate File
            const now = new Date();
            const dateString = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2,'0')}${now.getDate().toString().padStart(2,'0')}`;
            XLSX.writeFile(workbook, `Travel_Expenses_${dateString}.xlsx`);
            
            showToast("Excel匯出成功！");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = message;
            toast.classList.remove('opacity-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
</body>
